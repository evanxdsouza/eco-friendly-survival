<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eco Friendly Survival</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        --panel-bg: rgba(9, 18, 15, 0.86);
        --panel-border: rgba(120, 220, 170, 0.28);
        --accent: #5be49b;
        --text: #eafff2;
        --text-dim: #9ac2ad;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #070d0b;
        font-family: "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      #app { position: relative; width: 100vw; height: 100vh; }
      canvas { display: block; touch-action: none; }

      /* ---------------- loading ---------------- */
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(ellipse at 50% 40%, #12241d 0%, #070d0b 70%);
        z-index: 100;
        transition: opacity 0.6s ease;
      }
      #loading h1 {
        margin: 0;
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--accent);
        text-transform: uppercase;
      }
      #loading-track {
        width: min(340px, 70vw);
        height: 3px;
        background: rgba(255, 255, 255, 0.09);
        border-radius: 2px;
        overflow: hidden;
      }
      #loading-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #2f8f66, var(--accent));
        transition: width 0.35s ease;
      }
      #loading-msg { font-size: 0.78rem; color: var(--text-dim); letter-spacing: 0.03em; }

      /* ---------------- overlay panel ---------------- */
      #ui-overlay {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 10;
        width: 306px;
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        padding: 14px;
        backdrop-filter: blur(10px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      #ui-overlay::-webkit-scrollbar { width: 5px; }
      #ui-overlay::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 4px; }

      .overlay-title {
        font-size: 1rem;
        font-weight: 700;
        color: var(--accent);
        margin: 0 0 3px 0;
        letter-spacing: 0.02em;
      }
      .overlay-subtitle {
        font-size: 0.7rem;
        line-height: 1.45;
        color: var(--text-dim);
        margin: 0 0 12px 0;
      }

      .building-card {
        border: 1px solid var(--panel-border);
        border-radius: 10px;
        padding: 9px 10px;
        margin-bottom: 8px;
        background: rgba(255, 255, 255, 0.022);
        transition: border-color 0.2s ease, background 0.2s ease;
      }
      .building-card.active {
        border-color: rgba(91, 228, 155, 0.75);
        background: rgba(91, 228, 155, 0.07);
      }
      .building-card-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 7px;
      }
      .building-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
      .building-name { font-size: 0.8rem; font-weight: 600; }

      button {
        font-family: inherit;
        cursor: pointer;
        border: 1px solid var(--panel-border);
        background: rgba(91, 228, 155, 0.07);
        color: var(--text);
        border-radius: 7px;
        padding: 6px 8px;
        font-size: 0.71rem;
        transition: background 0.15s ease, transform 0.08s ease, border-color 0.15s ease;
        width: 100%;
        line-height: 1.25;
      }
      button:hover { background: rgba(91, 228, 155, 0.2); }
      button:active { transform: scale(0.97); }
      button.primary {
        background: rgba(91, 228, 155, 0.85);
        color: #06140d;
        font-weight: 700;
        border-color: transparent;
      }
      button.primary:hover { background: var(--accent); }
      button.active {
        background: rgba(91, 228, 155, 0.85);
        color: #06140d;
        font-weight: 700;
      }
      .btn-row { display: flex; gap: 6px; }
      .btn-row button { flex: 1; }

      .slider-row, .quality-row {
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .slider-row label, .quality-row label {
        font-size: 0.67rem;
        color: var(--text-dim);
        letter-spacing: 0.02em;
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
        height: 16px;
      }

      .globals {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--panel-border);
      }

      /* ---------------- toast + hint ---------------- */
      #info-toast {
        position: absolute;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 10px;
        padding: 9px 18px;
        font-size: 0.76rem;
        color: var(--text);
        z-index: 10;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s ease;
        white-space: nowrap;
        backdrop-filter: blur(8px);
      }
      #info-toast.visible { opacity: 1; }

      #hint {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 10;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 10px;
        padding: 9px 12px;
        font-size: 0.68rem;
        line-height: 1.6;
        color: var(--text-dim);
        max-width: 190px;
        backdrop-filter: blur(8px);
      }

      /* ---------------- 3D-anchored labels ---------------- */
      .label-panel {
        pointer-events: none;
        background: rgba(8, 16, 13, 0.9);
        border: 1px solid rgba(120, 220, 170, 0.45);
        border-radius: 10px;
        padding: 9px 13px;
        font-size: 0.72rem;
        color: #eafff2;
        min-width: 168px;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.28s ease, transform 0.28s ease;
        backdrop-filter: blur(6px);
        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.55);
      }
      .label-panel.visible { opacity: 1; transform: translateY(0); }
      .label-panel h4 {
        margin: 0 0 6px 0;
        font-size: 0.76rem;
        color: var(--accent);
        border-bottom: 1px solid rgba(120, 220, 170, 0.28);
        padding-bottom: 5px;
      }
      .label-panel ul { margin: 0; padding-left: 15px; }
      .label-panel li { margin-bottom: 2px; line-height: 1.4; }

      .banner-3d {
        pointer-events: none;
        font-weight: 800;
        letter-spacing: 0.045em;
        white-space: nowrap;
        color: #f4fff9;
        text-shadow: 0 0 22px rgba(91, 228, 155, 0.55), 0 2px 12px rgba(0, 0, 0, 0.8);
      }
      .banner-3d.title { font-size: 2.2rem; }

      @media (max-width: 760px) {
        #ui-overlay { width: calc(100vw - 32px); max-height: 46vh; }
        #hint { display: none; }
        .banner-3d.title { font-size: 1.4rem; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="loading">
        <h1>Eco Friendly Survival</h1>
        <div id="loading-track"><div id="loading-bar"></div></div>
        <div id="loading-msg">Initialising…</div>
      </div>

      <div id="ui-overlay"></div>

      <div id="hint">
        Drag to orbit<br />
        Scroll to zoom<br />
        Right-drag to pan<br />
        Click any building
      </div>

      <div id="info-toast"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
